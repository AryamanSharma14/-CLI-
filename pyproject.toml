[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portscope"
version = "0.1.0"
description = "The local dev runtime, port collision & Python environment guardian CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aryaman Sharma", email = "aryamansharma4810@gmail.com" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
portscope = "portscope.main:app"
devctl = "portscope.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["portscope*"]
